    .rx-card {

  </style>
</head>

    { text: '下班后微信工作群响一声，你的反应是？', options: [
      { emoji: '🏖️', label: '下班基本没人找，安心过日子', score: 4 }, { emoji: '📱', label: '偶尔回一句，不算烦', score: 1 },
      { emoji: '😰', label: '一听到提示音就生理性心慌烦躁', score: -4 }, { emoji: '💀', label: '24小时待命，连洗澡都在看工作群', score: -7 }
    ]},
    { text: '最近三个月，你的身体发出了什么信号？', options: [
      { emoji: '💪', label: '吃嘛嘛香，身体没啥毛病', score: 4 }, { emoji: '🥱', label: '经常疲惫犯困，提不起劲', score: -1 },
      { emoji: '🔥', label: '失眠、掉发、肠胃不舒服或焦虑易怒', score: -4 }, { emoji: '💔', label: '已经查出指标异常，身体在亮红灯', score: -7 }
    ]},
    { text: '每天早上闹钟响起要去上班那一刻，你在想什么？', options: [
      { emoji: '☀️', label: '正常起床搬砖，没太大情绪', score: 3 }, { emoji: '🛌', label: '好想请假再睡三天，真的好累', score: -2 },
      { emoji: '🌧️', label: '一想到要去公司就胸闷、想吐、抗拒', score: -6 }
    ]},
    { text: '如果现在给你放7天带薪假，你觉得回来后还会想辞职吗？', options: [
      { emoji: '🧘', label: '歇够了应该就能继续干下去', score: 3 }, { emoji: '🤔', label: '能缓一阵子，但迟早还是想走', score: -1 },
      { emoji: '🏃', label: '放一个月假也没用，我是一秒都不想再看见这家公司', score: -6 }
    ]}
  ];
  const TIERS = [
    { min: 80, title: '神仙养老岗！打死也别走！', fun: '🏆 职场天选之子', color: '#34d399' },
    { min: 65, title: '整体很稳，属于优质饭碗', fun: '🧘 稳健搬砖人', color: '#6ee7b7' },
    { min: 50, title: '食之无味弃之可惜，先苟住', fun: '🐴 骑驴找马选手', color: '#fbbf24' },
    { min: 35, title: '严重透支警报！急需停机回血', fun: '🔋 电量1%打工人', color: '#fb923c' },
    { min: 20, title: '快逃！这份工作正在吸干你', fun: '🏃 跑路预备役', color: '#f97316' },
    { min: 0,  title: '这不是上班，这是渡劫坐牢！', fun: '💀 职场濒危物种', color: '#ef4444' }
  ];

  const SCENE_LIMITS = {
    money:  { min: -5.75, max: 4.5 },
    time:   { min: -6.0,  max: 3.75 },
    growth: { min: -6.0,  max: 4.0 },
    social: { min: -5.75, max: 4.0 },
    mental: { min: -6.5,  max: 3.5 }
  };

  const BAR_COLORS = ['#818cf8', '#22d3ee', '#a78bfa', '#f472b6', '#fb7185'];
  const TOTAL_Q = 20;
  const RING_C = 2 * Math.PI * 52;
  let currentQ = 0;
  let answers = new Array(TOTAL_Q).fill(null);

  function qScore(qi) { return answers[qi] === null ? 0 : QUESTIONS[qi].options[answers[qi]].score; }
  function rawTotal() { return answers.reduce((s, _, i) => s + qScore(i), 0); }
  function toPercent(raw) { return Math.max(0, Math.min(100, Math.round(((raw + 120) / 201) * 100))); }
  function getTier(pct) { return TIERS.find(t => pct >= t.min) || TIERS[TIERS.length - 1]; }
  function getScene(qi) { return SCENES.find(s => qi >= s.qRange[0] && qi <= s.qRange[1]); }

  function sceneToTen(scene) {
    let sum = 0;
    for (let i = scene.qRange[0]; i <= scene.qRange[1]; i++) sum += qScore(i);
    const avg = sum / 4;
    const lim = SCENE_LIMITS[scene.id];
    const v = ((avg - lim.min) / (lim.max - lim.min)) * 9 + 1;
    return Math.max(1, Math.min(10, Math.round(v * 10) / 10));
  }

  function renderDots() {
    document.getElementById('dotsWrap').innerHTML = Array.from({ length: TOTAL_Q }, (_, i) =>
      `<div class="dot ${i === currentQ ? 'active' : answers[i] !== null ? 'done' : ''}"></div>`
    ).join('');
  }

  function renderQuestion() {
    const q = QUESTIONS[currentQ];
    const scene = getScene(currentQ);
    document.getElementById('sceneBadge').textContent = `${scene.icon} 维度 ${SCENES.indexOf(scene) + 1}/5：${scene.name}（第 ${currentQ + 1}/20 题）`;
    document.getElementById('sceneIntro').textContent = scene.intro;
    document.getElementById('qText').textContent = q.text;
    document.getElementById('quizTip').textContent = currentQ < 10 ? '💡 凭第一直觉选择，结果最准' : '🚀 马上测完，即将揭晓你该辞职还是该休息';
    const optsEl = document.getElementById('opts');
    optsEl.className = 'opts' + (q.options.length <= 3 ? ' cols-1' : '');
    optsEl.innerHTML = q.options.map((o, i) =>
      `<div class="opt ${answers[currentQ] === i ? 'selected' : ''}" data-i="${i}">
        <span class="opt-emoji">${o.emoji}</span><span class="opt-label">${o.label}</span>
      </div>`
    ).join('');
    optsEl.querySelectorAll('.opt').forEach(el => el.addEventListener('click', () => selectOption(+el.dataset.i)));
    renderDots();
    document.getElementById('btnPrev').disabled = currentQ === 0;
    document.getElementById('btnNext').textContent = currentQ === TOTAL_Q - 1 ? '查看诊断报告 ✨' : '下一题 →';
    document.getElementById('btnNext').disabled = answers[currentQ] === null;
  }

  function selectOption(idx) {
    if (navigator.vibrate) navigator.vibrate(12);
    answers[currentQ] = idx;
    renderQuestion();
    if (currentQ < TOTAL_Q - 1) setTimeout(() => { currentQ++; renderQuestion(); }, 320);
    else if (answers.every(a => a !== null)) setTimeout(() => showReport(), 360);
  }

  function buildPrescription(dims, pct) {
    const m = Object.fromEntries(dims.map(d => [d.id, d.ten]));
    const envAvg = (m.money + m.growth + m.social) / 3;
    const drainAvg = (m.time + m.mental) / 2;

    if (envAvg >= 5.5 && drainAvg <= 4.5) {
      return {
        title: '🛌 结论：你现在不该裸辞，你只是【严重透支】该休息了！',
        desc: '你的薪资、环境或发展底子其实不算差（环境分 ' + envAvg.toFixed(1) + '/10），但你的体力和心理电量已经快见底了（电量仅 ' + drainAvg.toFixed(1) + '/10）。你想逃离的根本不是这份工作，而是连续硬撑太久、快被榨干的自己！',
        actions: [
          '✅ 第一步：立刻请假 2～3 天连着周末睡个昏天黑地，别在电量 1% 时做辞职决定',
          '✅ 第二步：下班后强制开启工作群免打扰，把准点下班当成头等大事',
          '✅ 第三步：彻底休息一周后，如果提起上班不再胸闷，就继续稳稳拿这份工资'
        ],
        letterTitle: '🎭 给领导的《回血请假信》（可直接复制）',
        letter: '领导好，最近连续高强度跟进项目，身体实在有些透支亮红灯了。为了不耽误后续进度，我想申请休假 3 天去医院调理并彻底休息一下，手头急事已交代妥当，充好电回来继续战斗！'
      };
    }
    if (m.money >= 6.5 && drainAvg <= 4.2) {
      return {
        title: '💰 结论：高薪坐牢局——先别裸辞，把钱攒够再撤！',
        desc: '这是一份典型的「拿命换钱」工作：经济回报高达 ' + m.money + '/10，但身心电量只剩 ' + drainAvg.toFixed(1) + '/10。裸辞会立刻断掉高现金流让你更焦虑，但硬撑会垮掉。',
        actions: [
          '✅ 第一步：给自己设一个「赎身攒钱倒计时」（比如再拿 3 个月工资或拿完年终奖就走）',
          '✅ 第二步：从今天起只做及格线60分的工作，停止一切自我感动的额外付出',
          '✅ 第三步：拿工资去买能让你爽的服务（按摩、打车、请假休息），用钱对冲精神损失'
        ],
        letterTitle: '🎭 给自己的《带薪回血备忘录》',
        letter: '我来上班只是为了出租时间换取高额精神损失费，不是来卖命的。只要工资还在到账，老板的PUA就是耳边风。攒够目标金额，立刻潇洒走人！'
      };
    }
    if (envAvg <= 4.2 && drainAvg <= 4.5) {
      return {
        title: '🏃 结论：别怀疑了，你该【准备辞职】！是这份工作在吸干你',
        desc: '这不是休息两天能解决的问题——你的工作回报与环境分只有 ' + envAvg.toFixed(1) + '/10，身心电量也只剩 ' + drainAvg.toFixed(1) + '/10。钱少、事多、环境有毒全占了，继续耗着只会连跳槽的力气都被磨没。',
        actions: [
          '✅ 第一步：今天下班立刻开启「带薪摸鱼 + 改简历」模式，把精力100%收回来找下家',
          '✅ 第二步：如果身体已经失眠心悸，哪怕裸辞休息一个月也比把自己熬进医院强',
          '✅ 第三步：在拿到新 Offer 或决定走人那一刻前，不再为公司的烂摊子多熬一分钟'
        ],
        letterTitle: '🎭 给 HR 的《体面离职信》（可直接复制）',
        letter: '您好！感谢公司这段时间的照顾。经过综合考虑个人职业规划与身体状态，我决定申请离职，预计最后工作日为下月X日。接下来我会配合做好工作交接，祝公司未来发展一切顺利！'
      };
    }
    if (drainAvg >= 5.5 && (m.money <= 4.5 || m.growth <= 4.5)) {
      return {
        title: '🍵 结论：温水煮青蛙局——千万别裸辞，带薪搞副业/找下家！',
        desc: '你现在并不算真正累垮（身心电量还有 ' + drainAvg.toFixed(1) + '/10），你烦躁是因为钱少或没奔头（回报/前景低）。这时候裸辞最亏，因为你白白放弃了一个能发工资的自习室！',
        actions: [
          '✅ 第一步：把主业当成保底饭票，用30%精力应付完交差',
          '✅ 第二步：利用上班摸鱼和准点下班的时间，秘密投简历、学AI做副业或考证',
          '✅ 第三步：等副业跑通或新 Offer 到手再无缝切换，绝不空窗期裸辞'
        ],
        letterTitle: '🎭 给自己的《骑驴找马行动书》',
        letter: '这份工作虽然钱不多、没啥大前途，但它最大的优点是不至于把我累死。从今天起，公司就是我的带薪创业基地，先苟住发育，找到大马再换驴！'
      };
    }
    return {
      title: '🧘 结论：先休息调整！你的工作处于【比上不足比下有余】状态',
      desc: '综合存活指数 ' + pct + ' 分。这份工作有让你烦躁的地方，但还没烂到必须立刻逃跑的程度。你现在的倦怠70%来自阶段性疲劳和情绪堆积。',
      actions: [
        '✅ 第一步：先请假或趁周末彻底断联休息2天，清空大脑里的垃圾情绪',
        '✅ 第二步：把下面得分最低的那个维度单独拎出来，看看能不能通过沟通或摸鱼解决',
        '✅ 第三步：一边稳住现有收入，一边不紧不慢地看外部机会，有更好的再跳'
      ],
      letterTitle: '🎭 给领导的《状态调整请假条》',
      letter: '领导好，近期家里有点私事需要处理，顺便调整一下身体状态，申请周X请假一天，工作已提前安排妥当，收到请批复，感谢！'
    };
  }
  function drawRadar(canvas, dims) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const W = rect.width || 300, H = rect.height || 270;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2, maxR = Math.min(W, H) * 0.30, labelR = maxR + 26;
    const n = dims.length, step = (Math.PI * 2) / n, start = -Math.PI / 2;

    for (let lv = 1; lv <= 5; lv++) {
      const r = (maxR / 5) * lv;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const a = start + i * step;
        i === 0 ? ctx.moveTo(cx + r * Math.cos(a), cy + r * Math.sin(a)) : ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.stroke();
    }
    const pts = dims.map((d, i) => {
      const a = start + i * step, r = (d.ten / 10) * maxR;
      return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
    });
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.fillStyle = 'rgba(56, 189, 248, 0.28)'; ctx.fill();
    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = '600 12px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    dims.forEach((d, i) => {
      const a = start + i * step;
      const x = cx + labelR * Math.cos(a), y = cy + labelR * Math.sin(a);
      ctx.textAlign = Math.abs(Math.cos(a)) < 0.2 ? 'center' : Math.cos(a) > 0 ? 'left' : 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${d.name} ${d.ten}`, x, y);
    });
  }

  let lastCopyText = '';

  function showReport() {
    document.getElementById('quizView').classList.add('hidden');
    const analyzing = document.getElementById('analyzing');
    analyzing.classList.add('show');
    setTimeout(() => {
      analyzing.classList.remove('show');
      const pct = toPercent(rawTotal());
      const tier = getTier(pct);
      const dims = SCENES.map(s => ({ ...s, ten: sceneToTen(s) }));
      const rx = buildPrescription(dims, pct);

      const ring = document.getElementById('resultRing');
      ring.style.strokeDashoffset = RING_C * (1 - pct / 100);
      ring.style.stroke = tier.color;
      document.getElementById('resultScore').textContent = pct;
      document.getElementById('verdictMain').textContent = tier.title;
      const funEl = document.getElementById('verdictFun');
      funEl.textContent = tier.fun;
      funEl.style.color = tier.color;
      funEl.style.border = `1px solid ${tier.color}66`;
      document.getElementById('benchmark').textContent = `📊 你的职场存活状态超过了 ${Math.max(3, Math.min(98, pct))}% 的同龄打工人`;

      document.getElementById('rxTitle').textContent = rx.title;
      document.getElementById('rxDesc').textContent = rx.desc;
      document.getElementById('rxList').innerHTML = rx.actions.map(a => `<li>${a}</li>`).join('');

      document.getElementById('dimBars').innerHTML = dims.map((d, i) => `
        <div class="dim-row">
          <div class="dim-head"><span>${d.icon} ${d.name}</span><span>${d.ten} / 10</span></div>
          <div class="bar-track"><div class="bar-fill" data-w="${d.ten * 10}" style="background:${BAR_COLORS[i]}"></div></div>
        </div>`).join('');

      const sorted = [...dims].sort((a, b) => b.ten - a.ten);
      const best = sorted[0], worst = sorted[sorted.length - 1];
      document.getElementById('insights').innerHTML = [
        `💡 <strong>你目前最大的支撑点</strong>：【${best.name}】（${best.ten}/10），这是你还没彻底崩溃的核心缓冲垫。`,
        `⚠️ <strong>最消耗你的致命短板</strong>：【${worst.name}】（${worst.ten}/10），你想逃离的念头 80% 都是被这一项逼出来的。`,
        `🧭 <strong>去留判断金线</strong>：如果请假休息 3 天后【心理电量】能恢复，就别裸辞；如果一想到回去见那些人就生理性恶心，说明是【环境毒性】超标，尽早规划换地方。`
      ].map(t => `<li>${t}</li>`).join('');

      document.getElementById('letterHeading').textContent = rx.letterTitle;
      document.getElementById('resignLetter').textContent = rx.letter;
      lastCopyText = `【打工人状态深度诊断】\n职场存活指数：${pct}分（${tier.fun}）\n${rx.title}\n\n${rx.letter}`;

      document.getElementById('resultView').classList.add('show');
      requestAnimationFrame(() => {
        drawRadar(document.getElementById('radarCanvas'), dims);
        document.querySelectorAll('#dimBars .bar-fill').forEach(b => { b.style.width = b.dataset.w + '%'; });
      });
    }, 1200);
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  document.getElementById('btnPrev').onclick = () => { if (currentQ > 0) { currentQ--; renderQuestion(); } };
  document.getElementById('btnNext').onclick = () => {
    if (answers[currentQ] === null) return;
    if (currentQ === TOTAL_Q - 1) showReport();
    else { currentQ++; renderQuestion(); }
  };
  document.getElementById('btnCopyAll').onclick = () => {
    navigator.clipboard.writeText(lastCopyText).then(() => toast('✅ 已复制诊断报告与信件！')).catch(() => toast('✅ 复制成功'));
  };
  document.getElementById('btnRetest').onclick = () => {
    answers = new Array(TOTAL_Q).fill(null); currentQ = 0;
    document.getElementById('resultView').classList.remove('show');
    document.getElementById('quizView').classList.remove('hidden');
    renderQuestion();
  };

  renderQuestion();
})();
</script>
